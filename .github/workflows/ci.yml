name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # 依次执行:测试 → spotless:check → checkstyle → pmd(P3C) → spotbugs(+FindSecBugs)
      - name: 构建、测试与代码检查
        run: ./mvnw -B verify

  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # 恢复与保存分开:扫出漏洞导致任务失败时,也要保存已下载的 NVD 库,否则每次都要重新下载(约 30 分钟)
      - name: 恢复 NVD 漏洞库缓存
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/dependency-check
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-
      # 扫描第三方依赖已知 CVE,CVSS >= 7 即失败。NVD_API_KEY 在仓库 Secrets 中配置。
      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B -DskipTests -Psecurity verify
      - name: 保存 NVD 漏洞库缓存
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/dependency-check
          key: nvd-${{ github.run_id }}
